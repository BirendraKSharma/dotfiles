include ~/.config/omarchy/current/theme/kitty.conf

# ─── Font ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_italic_font auto
font_size        9.0

# ─── Window ──────────────────────────────────────────────────────────────────
window_padding_width        14
hide_window_decorations     yes
confirm_os_window_close     0
resize_in_steps             yes
initial_window_width        120c
initial_window_height       36c

# ─── Keybindings ─────────────────────────────────────────────────────────────
map ctrl+insert         copy_to_clipboard
map shift+insert        paste_from_clipboard

# Tabs
map ctrl+t              new_tab_with_cwd
map ctrl+w              close_tab
map ctrl+tab            next_tab
map ctrl+shift+tab      previous_tab
map ctrl+1              goto_tab 1
map ctrl+2              goto_tab 2
map ctrl+3              goto_tab 3
map ctrl+4              goto_tab 4
map ctrl+5              goto_tab 5

# Rename current tab
map ctrl+alt+t          set_tab_title

# Splits (windows within a tab)
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+w        close_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window
map ctrl+shift+f        move_window_forward

# Font size
map ctrl+equal          change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+0              change_font_size all 0

# Scrollback
map ctrl+shift+h        show_scrollback
map ctrl+shift+up       scroll_page_up
map ctrl+shift+down     scroll_page_down

# ─── Remote Control ──────────────────────────────────────────────────────────
allow_remote_control    yes

# ─── Aesthetics ──────────────────────────────────────────────────────────────
cursor_shape             block
cursor_blink_interval    0
shell_integration        no-cursor
enable_audio_bell        no

# Slightly transparent — remove if you don't want this
# background_opacity     0.95

# ─── Tab Bar ─────────────────────────────────────────────────────────────────
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         1
tab_title_template       {' ' if num_tabs > 1 else ''}{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_font_style    bold

# ─── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines         10000
scrollback_pager         less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ─── Performance ─────────────────────────────────────────────────────────────
repaint_delay            10
input_delay              3
sync_to_monitor          yes

# ─── Mouse ───────────────────────────────────────────────────────────────────
mouse_hide_wait          3.0
# Copy on select (paste with middle-click like X11 convention)
copy_on_select           yes
strip_trailing_spaces    smart

# ─── URLs ────────────────────────────────────────────────────────────────────
url_style                curly
open_url_with            default
detect_urls              yes
