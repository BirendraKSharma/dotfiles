# ~/.config/aria2/aria2.conf

# ─── Download Directory ──────────────────────────────────────────────────────
dir=${HOME}/Downloads

# ─── General ─────────────────────────────────────────────────────────────────
# Resume incomplete downloads automatically
continue=true

# Max simultaneous downloads
max-concurrent-downloads=3

# Retry up to 5 times on failure
max-tries=5
retry-wait=10

# Timeout (seconds) after connection is established
timeout=300

# ─── Connections & Speed ──────────────────────────────────────────────────────
# Connections per server (higher = faster on good servers)
max-connection-per-server=8

# Split each file into N streams
split=8

# Don't split files smaller than this
min-split-size=20M

# Speed limits (0 = unlimited). Uncomment to cap:
# max-overall-download-limit=5M
# max-download-limit=0

# ─── File Handling ────────────────────────────────────────────────────────────
# Rename instead of overwriting if file exists
auto-file-renaming=true
allow-overwrite=false

# File pre-allocation (helps with large files; use 'none' on SSDs/btrfs)
file-allocation=falloc

# ─── Integrity ────────────────────────────────────────────────────────────────
check-integrity=true

# ─── HTTP/FTP ─────────────────────────────────────────────────────────────────
# Use .netrc for credentials (~/.netrc)
# netrc-path=${HOME}/.netrc

# Follow HTTP redirects
follow-metalink=true

# Browser-like user agent (helps with some servers)
user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36

# ─── BitTorrent ───────────────────────────────────────────────────────────────
listen-port=6881-6999
bt-max-peers=55
seed-ratio=1.0
seed-time=60
# Save .torrent metadata files
bt-save-metadata=true

# ─── RPC (for web UIs like AriaNg) ───────────────────────────────────────────
# Uncomment the block below if you want a web frontend
# enable-rpc=true
# rpc-listen-port=6800
# rpc-listen-all=false
# rpc-secret=your_secret_token_here

# ─── Logging ─────────────────────────────────────────────────────────────────
log-level=warn
# log=${HOME}/.config/aria2/aria2.log
